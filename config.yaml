# Advanced AGI Config

system:
  name: "AGI-SelfEvolving-Core"
  version: "2.0.0"
  mode: "development"  # production, development, testing

perception:
  vision:
    backbone: "vit_large_patch16_224"
    pretrained: true
    fine_tune: true
  text:
    model: "bert-base-multilingual-cased"
    max_length: 512
  audio:
    model: "wav2vec2-base"
    sample_rate: 16000
  fusion:
    method: "transformer_cross_attention"
    hidden_dim: 2048
    num_heads: 16

memory:
  hierarchical:
    working_memory_size: 100
    episodic_memory_capacity: 100000
    semantic_memory_capacity: 500000
    procedural_memory_capacity: 10000
  consolidation:
    enabled: true
    interval: 1000
    batch_size: 32
  retrieval:
    method: "content_based_attention"
    top_k: 10
    similarity_threshold: 0.7

learning:
  self_supervised:
    methods:
      - "contrastive_learning"
      - "masked_modeling"
      - "temporal_prediction"
    loss_weights:
      contrastive: 0.4
      reconstruction: 0.3
      prediction: 0.3
  meta_learning:
    enabled: true
    inner_lr: 0.001
    outer_lr: 0.0001
    adaptation_steps: 5
  curriculum:
    enabled: true
    difficulty_metrics:
      - "prediction_error"
      - "novelty"
      - "skill_complexity"

motivation:
  intrinsic:
    components:
      curiosity:
        type: "prediction_error"
        weight: 0.4
      novelty:
        type: "density_based"
        weight: 0.3
      surprise:
        type: "bayesian"
        weight: 0.2
      competence:
        type: "skill_mastery"
        weight: 0.1
  extrinsic:
    reward_shaping: true
    discount_factor: 0.99

multiagent:
  specialists:
    - domain: "visual_reasoning"
      architecture: "transformer"
      capacity: 512
    - domain: "language_understanding"
      architecture: "transformer"
      capacity: 1024
    - domain: "procedural_planning"
      architecture: "graph_network"
      capacity: 256
    - domain: "social_interaction"
      architecture: "attention"
      capacity: 384
    - domain: "creative_generation"
      architecture: "generative"
      capacity: 768
  coordination:
    method: "attention_based"
    aggregation: "weighted_sum"

self_modification:
  enabled: true
  evaluation_period: 1000
  mutation_types:
    - "architecture_expansion"
    - "parameter_adjustment"
    - "connection_pruning"
    - "module_addition"
  safety_checks:
    enabled: true
    rollback_on_failure: true
    simulation_before_apply: true

monitoring:
  metrics:
    - "performance"
    - "memory_usage"
    - "learning_speed"
    - "exploration_rate"
    - "stability"
  logging:
    level: "INFO"
    directory: "./logs"
    retention_days: 30
  visualization:
    enabled: true
    update_interval: 100

hardware:
  device: "cuda"  # cuda, cpu, mps
  precision: "mixed"  # float32, float16, bfloat16, mixed
  distributed:
    enabled: false
    strategy: "ddp"
  memory:
    gradient_checkpointing: true
    offload_to_cpu: false

safety:
  constraints:
    max_memory_usage: 0.8
    min_performance_threshold: 0.3
    max_behavior_divergence: 0.5
  emergency_protocols:
    performance_drop: "rollback"
    memory_leak: "restart"
    instability: "pause_and_analyze"